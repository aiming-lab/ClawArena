[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "requests-patched"
version = "2.32.3.post1"
description = "Company internal fork of psf/requests with CVE-2024-47081 patch"
requires-python = ">=3.8"
dependencies = [
    "certifi>=2017.4.17",
    "charset-normalizer>=2,<4",
    "idna>=2.5,<4",
    "urllib3>=1.21.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "requests-mock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.security]
cve_tracked = ["CVE-2024-47081", "CVE-2023-32681"]
patch_status = "in-progress"
fixed_upstream_version = "2.32.4"
