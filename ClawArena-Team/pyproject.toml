[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawarena-team"
version = "1.0.0"
description = "Subagent Management Benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kevinx0522" }]
dependencies = [
    "pyyaml>=6.0",
    "transformers>=4.40",
    "jinja2>=3.1",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "esprima>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "huggingface_hub>=0.23",
    "reportlab>=4.0",
]
# fix/audit-top10 #9: tests/test_multimodal.py and test_multimodal_e2e.py require
# imageio + opencv to run the real video tests; without them these tests
# pytest.skip (guard already added). To run the full multimodal suite:
# `pip install -e .[dev,video]`
video = [
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "opencv-python-headless>=4.10",
]

[project.scripts]
clawarena-team = "clawarena_team.cli:main"
cateam = "clawarena_team.cli:main"
ca-team = "clawarena_team.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clawarena_team = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
