# Helm values — platform-gateway (prod)
replicaCount: 2

image:
  repository: registry.mercatorrobotics.com/platform-gateway
  tag: "1.5.8"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: platform-gateway.mercatorrobotics.internal
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1758m
    memory: 1766Mi
  requests:
    cpu: 443m
    memory: 282Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

postgresql:
  enabled: false
  externalHost: prod-platform-gateway-db.us-east-1.rds.amazonaws.com
  port: 5432
  lockTimeout: "30s"
  logMinDurationStatement: "500ms"

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring

podDisruptionBudget:
  enabled: true
  minAvailable: 1

migration:
  enabled: true
  tool: flyway
  lockTimeoutMs: 30000
  dualApprovalRequired: true
  auditTrailRetentionYears: 3

serviceAccount:
  create: true
  annotations: {}
  name: "platform-gateway-sa"

