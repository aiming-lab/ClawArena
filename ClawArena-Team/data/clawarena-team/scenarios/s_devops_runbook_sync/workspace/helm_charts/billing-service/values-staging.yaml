# Helm values — billing-service (prod)
replicaCount: 3

image:
  repository: registry.mercatorrobotics.com/billing-service
  tag: "1.4.28"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: billing-service.mercatorrobotics.internal
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1737m
    memory: 1904Mi
  requests:
    cpu: 123m
    memory: 468Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

postgresql:
  enabled: false
  externalHost: prod-billing-db.us-east-1.rds.amazonaws.com
  port: 5432
  lockTimeout: "30s"
  logMinDurationStatement: "500ms"

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring

podDisruptionBudget:
  enabled: true
  minAvailable: 1

migration:
  enabled: true
  tool: flyway
  lockTimeoutMs: 30000
  dualApprovalRequired: true
  auditTrailRetentionYears: 3

serviceAccount:
  create: true
  annotations: {}
  name: "billing-service-sa"

