# Helm values — audit-trail-service (prod)
replicaCount: 2

image:
  repository: registry.mercatorrobotics.com/audit-trail-service
  tag: "1.4.7"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: audit-trail-service.mercatorrobotics.internal
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1321m
    memory: 585Mi
  requests:
    cpu: 245m
    memory: 280Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

postgresql:
  enabled: false
  externalHost: prod-audit-trail-db.us-east-1.rds.amazonaws.com
  port: 5432
  lockTimeout: "30s"
  logMinDurationStatement: "500ms"

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring

podDisruptionBudget:
  enabled: true
  minAvailable: 1

migration:
  enabled: true
  tool: flyway
  lockTimeoutMs: 30000
  dualApprovalRequired: true
  auditTrailRetentionYears: 3

serviceAccount:
  create: true
  annotations: {}
  name: "audit-trail-service-sa"

