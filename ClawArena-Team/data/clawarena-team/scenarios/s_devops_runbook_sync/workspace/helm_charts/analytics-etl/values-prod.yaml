# Helm values — analytics-etl (prod)
replicaCount: 4

image:
  repository: registry.mercatorrobotics.com/analytics-etl
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: analytics-etl.mercatorrobotics.internal
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 791m
    memory: 1269Mi
  requests:
    cpu: 165m
    memory: 613Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

postgresql:
  enabled: false
  externalHost: prod-analytics-etl-db.us-east-1.rds.amazonaws.com
  port: 5432
  lockTimeout: "30s"
  logMinDurationStatement: "500ms"

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring

podDisruptionBudget:
  enabled: true
  minAvailable: 1

migration:
  enabled: true
  tool: flyway
  lockTimeoutMs: 30000
  dualApprovalRequired: true
  auditTrailRetentionYears: 3

serviceAccount:
  create: true
  annotations: {}
  name: "analytics-etl-sa"

