# Helm values — payment-service (prod)
replicaCount: 4

image:
  repository: registry.mercatorrobotics.com/payment-service
  tag: "1.1.11"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: payment-service.mercatorrobotics.internal
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1153m
    memory: 1313Mi
  requests:
    cpu: 275m
    memory: 604Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

postgresql:
  enabled: false
  externalHost: prod-payment-db.us-east-1.rds.amazonaws.com
  port: 5432
  lockTimeout: "30s"
  logMinDurationStatement: "500ms"

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring

podDisruptionBudget:
  enabled: true
  minAvailable: 1

migration:
  enabled: true
  tool: flyway
  lockTimeoutMs: 30000
  dualApprovalRequired: true
  auditTrailRetentionYears: 3

serviceAccount:
  create: true
  annotations: {}
  name: "payment-service-sa"

