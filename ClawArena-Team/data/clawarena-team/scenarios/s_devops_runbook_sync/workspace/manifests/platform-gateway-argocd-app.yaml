apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-gateway
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://gitops.mercatorrobotics.com/helm-charts
    targetRevision: v5.1.9
    chart: platform-gateway
    helm:
      releaseName: platform-gateway
      valueFiles:
      - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
