apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: audit-trail-service
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://gitops.mercatorrobotics.com/helm-charts
    targetRevision: v3.8.2
    chart: audit-trail-service
    helm:
      releaseName: audit-trail-service
      valueFiles:
      - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
