apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics-etl-ingress
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: analytics-etl.mercatorrobotics.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: analytics-etl
            port:
              name: http
