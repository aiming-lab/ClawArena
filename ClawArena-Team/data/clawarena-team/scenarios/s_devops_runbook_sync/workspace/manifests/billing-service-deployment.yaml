apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: prod
  labels:
    app: billing-service
    team: platform
    version: "1.2.23"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
        version: "1.2.23"
    spec:
      serviceAccountName: billing-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: billing-service
        image: registry.mercatorrobotics.com/billing-service:1.2.23
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 299m
            memory: 811Mi
          limits:
            cpu: 1555m
            memory: 1227Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: billing-service-db-secret
              key: host
        - name: DB_PORT
          value: "5432"
        - name: LOCK_TIMEOUT
          value: "30000"
        - name: LOG_LEVEL
          value: INFO
