# infra/k8s/deployment.yaml — checkout-service Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: prod
  labels:
    app: checkout-service
    version: redis-client-v3.2.1
spec:
  replicas: 8
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
    spec:
      containers:
      - name: checkout-service
        image: internal.registry/checkout-service:v2.8.3
        ports:
        - containerPort: 8080
        env:
        - name: REDIS_HOST
          value: "checkout-redis-prod.cache.amazonaws.com"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_POOL_SIZE
          value: "5"   # BUG: should be 20 — see pkg/redis_client.go:84
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /api/v2/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: prod
spec:
  selector:
    app: checkout-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
