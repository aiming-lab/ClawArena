# Notification Channel Configuration

- name: svp_mobile
  platform: mobile_app
  target: david_chen_iphone
  # Primary alert channel for SVP

- name: oncall_pager
  platform: pushover
  api_key: !secret pushover_api_key
  user_key: !secret pushover_user_key
  # Security oncall notification channel

- name: email_alerts
  platform: smtp
  server: smtp.gmail.com
  port: 587
  sender: homeassistant@mercator.example.com
  recipient: priya.anand@mercator.example.com

- name: sms_backup
  platform: twilio
  account_sid: !secret twilio_sid
  auth_token: !secret twilio_token
  from_number: !secret twilio_from
  to_number: !secret david_cell
