# Camera Configuration
# Five cameras covering all entry points and basement utility room

- platform: ffmpeg
  name: "Front Door Camera"
  device_id: cam_front_door_01
  input: rtsp://192.168.1.201:554/stream1
  extra_arguments: -pred 1 -q:v 2

- platform: ffmpeg
  name: "Driveway Camera"
  device_id: cam_driveway_02
  input: rtsp://192.168.1.202:554/stream1

- platform: ffmpeg
  name: "Basement Utility Camera"
  device_id: cam_basement_03
  input: rtsp://192.168.1.203:554/stream1
  extra_arguments: -pred 1
  # This camera covers the utility room and basement stairs
  # It triggered the face detection alert on 2026-05-16 at 02:14:07

- platform: ffmpeg
  name: "Living Room Camera"
  device_id: cam_living_room_04
  input: rtsp://192.168.1.204:554/stream1

- platform: ffmpeg
  name: "Backyard Camera"
  device_id: cam_backyard_05
  input: rtsp://192.168.1.205:554/stream1
