# Home Assistant Main Configuration
# Mercator Robotics — Chen Residence Smart Home
# Version: 2026.05.3  Updated: 2026-05-15

homeassistant:
  name: "Chen Residence"
  latitude: 37.7749
  longitude: -122.4194
  elevation: 52
  unit_system: metric
  time_zone: America/Los_Angeles
  country: US

default_config:

http:
  server_port: 8123
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.1.0/24

recorder:
  purge_keep_days: 90
  include:
    entity_globs:
      - sensor.*
      - binary_sensor.*
      - camera.*
      - lock.*

logbook:
  include:
    entity_globs:
      - sensor.*
      - camera.*
      - lock.*

history:
  include:
    entity_globs:
      - sensor.*
      - camera.*

# Integrations
camera: !include camera.yaml
sensor: !include sensor.yaml
notify: !include notify.yaml
device_tracker: !include device_tracker.yaml
input_boolean: !include input_boolean.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
automation: !include automations.yaml
