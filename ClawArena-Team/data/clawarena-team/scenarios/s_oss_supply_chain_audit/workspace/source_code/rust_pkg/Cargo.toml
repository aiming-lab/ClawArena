[package]
name = "mase-sim"
version = "0.9.0"
edition = "2021"
authors = ["Mercator Robotics <oss@mercator-robotics.com>"]
description = "Mercator Autonomous Simulation Engine"
license = "Apache-2.0"
repository = "https://github.com/mercator-robotics/mase"

[dependencies]
serde = { version = "1.0.197", features = ["derive"] }
tokio = { version = "1.37.0", features = ["full"] }
clap = { version = "4.5.4", features = ["derive"] }
anyhow = "1.0.81"
byteorder = "1.5.0"
rand = "0.8.5"
log = "0.4.21"
lib-tinypath = "1.4.2"  # WARNING: CVE-2026-21847 — pin to 1.4.1 when patched

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
