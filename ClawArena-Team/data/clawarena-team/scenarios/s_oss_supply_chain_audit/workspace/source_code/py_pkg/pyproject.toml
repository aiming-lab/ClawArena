[tool.poetry]
name = "mase-sim"
version = "0.9.0"
description = "Mercator Autonomous Simulation Engine"
authors = ["Mercator Robotics <oss@mercator-robotics.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/mercator-robotics/mase"

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26.4"
pydantic = "^2.7.0"
httpx = "^0.27.0"
typer = "^0.12.0"
rich = "^13.7.1"
colorz = "^2.3.1"  # WARNING: suspected typosquat of colorz-py — drop before release

[tool.poetry.dev-dependencies]
pytest = "^8.1"
mypy = "^1.10"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
