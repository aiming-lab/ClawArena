apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: payment-svc-role-2
  labels:
    app: payment-svc
    tier: rbac
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: payment-svc-binding-2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: payment-svc-role-2
subjects:
- kind: ServiceAccount
  name: payment-svc
  namespace: payments
