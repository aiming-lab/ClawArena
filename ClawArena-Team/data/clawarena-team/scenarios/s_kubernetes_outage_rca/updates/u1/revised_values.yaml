        # Helm values for payment-svc chart 1.18.4 (HOTFIX)
        # This file contains the CORRECTED memory limit: 2048Mi
        # Previous value in 1.18.3: 512Mi (regression — do not use)
        # Authoritative correct value: correct_memory_limit_mi = 2048

        replicaCount: 5

        image:
          repository: registry.internal/payment-svc
          pullPolicy: IfNotPresent
          tag: "1.18.4"

        serviceAccount:
          create: true
          name: payment-svc

        service:
          type: ClusterIP
          port: 80
          targetPort: 8080

        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "2048Mi"    # FIXED: restored from regression (was 512Mi in 1.18.3)
            cpu: "1000m"

        sidecar:
          enabled: true
          image: envoyproxy/envoy:v1.29.0
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

        autoscaling:
          enabled: true
          minReplicas: 3
          maxReplicas: 20
          targetCPUUtilizationPercentage: 70
          targetMemoryUtilizationPercentage: 80

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        ingress:
          enabled: true
          className: nginx
          hosts:
            - host: payment.internal.example.com
              paths:
                - path: /
                  pathType: Prefix

        nodeSelector:
          kubernetes.io/os: linux
          node-pool: "eu-west-2a"

