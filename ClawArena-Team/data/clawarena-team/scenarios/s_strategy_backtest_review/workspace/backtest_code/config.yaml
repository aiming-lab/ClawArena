      # AlphaWave-7 Backtest Configuration
      # Strategy: Cross-sectional momentum, Russell 1000 universe
      # Author: Dr. Elena Vasquez
      # Version: 4.1.0

      strategy:
        name: AlphaWave-7
        type: cross_sectional_momentum

      data:
        parquet_path: ../market_data.parquet
        start_date: "2018-01-01"
        end_date: "2022-12-31"

      signal:
        momentum_lookback_months: 12
        momentum_skip_months: 1
        universe_top_quintile_frac: 0.20

      execution:
        commission_bps: 5
        slippage_bps: 3
        rebalance_freq: monthly_end

      universe:
        source: vendor_static
        # survivorship_corrected: false
        # NOTE: The vendor's default static universe does NOT include delisted
        # tickers (2018-2022 delistings). Point-in-time data available via
        # premium subscription. This is a known limitation — see voice memo.
        survivorship_corrected: false
        min_avg_daily_volume_usd: 1000000
        universe_symbols:
          - AAPL
- MSFT
- AMZN
- GOOG
- META
- TSLA
- NVDA
- AMD
- JPM
- BAC
- WFC
- GS
- MS
- BLK
- SCHW
- C
- XOM
- CVX
- COP
- EOG
- SLB
- HAL
- VLO
- PSX
- JNJ
- PFE
- MRK
- ABT
- BMY
- GILD
- AMGN
- BIIB
- HD
- LOW
- TGT
- WMT
- COST
- AMZN
- EBAY
- ETSY

      performance:
        claimed_sharpe: 2.31
        # NOTE: The above Sharpe was computed with the look-ahead bug present.
        # Corrected Sharpe (after fixing signal alignment) must be computed
        # from market_data.parquet — not hard-coded here.

      risk:
        max_drawdown_limit: -0.25
        position_concentration_limit: 0.10
        sector_deviation_limit: 0.15
