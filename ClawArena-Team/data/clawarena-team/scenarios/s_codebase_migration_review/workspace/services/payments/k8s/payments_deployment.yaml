# Auto-generated Kubernetes / deployment config for payments-split migration review.
# Service: payments
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  namespace: payments-split
  labels:
    app: payments
    version: "v2"
    team: platform-migration

spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        version: "v2"
    spec:
      serviceAccountName: payments-sa
      containers:
      - name: payments
        image: gcr.io/payments-split/payments:v2.11.19
        imagePullPolicy: Always
        ports:
        - containerPort: 8327
        env:
        - name: SERVICE_NAME
          value: "payments"
        - name: ENV
          valueFrom:
            secretKeyRef:
              name: payments-secrets
              key: environment
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              name: payments-db-creds
              key: dsn
        resources:
          requests:
            cpu: "209m"
            memory: "512Mi"
          limits:
            cpu: "862m"
            memory: "2048Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8327
          initialDelaySeconds: 17
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8327
          initialDelaySeconds: 15
          periodSeconds: 5
      - name: payments-sidecar-1
        image: gcr.io/payments-split/payments-sidecar-1:v2.7.48
        imagePullPolicy: Always
        ports:
        - containerPort: 8328
        env:
        - name: SERVICE_NAME
          value: "payments"
        - name: ENV
          valueFrom:
            secretKeyRef:
              name: payments-secrets
              key: environment
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              name: payments-db-creds
              key: dsn
        resources:
          requests:
            cpu: "101m"
            memory: "512Mi"
          limits:
            cpu: "1753m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8328
          initialDelaySeconds: 17
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8328
          initialDelaySeconds: 9
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: payments-svc
  namespace: payments-split
spec:
  selector:
    app: payments
  ports:
  - protocol: TCP
    port: 8327
    targetPort: 8327
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payments-hpa
  namespace: payments-split
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payments-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: payments-split
data:
  app.yaml: |
    service: payments
    version: v2
    port: 8327
    log_level: info
    timeouts:
      read: 30s
      write: 30s
      idle: 90s
    retry:
      max_attempts: 3
      backoff_ms: 100
    db:
      pool_size: 20
      max_idle: 2
      conn_timeout: 5s
    metrics:
      enabled: true
      path: /metrics
      port: 8328
