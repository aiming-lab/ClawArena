syntax = "proto3";

package payments_split.reports;

option go_package = "github.com/org/payments-split/reports";

// Reports service definition for payments-split migration.
// Generated as part of monorepo split review.

message ReportsRecordV0 {
  uint64 status_0 = 1;
  sint64 amount_1 = 2;
  double nonce_2 = 3;
  string signature_3 = 4;
}

message ReportsRequestV1 {
  int64 signature_0 = 1;
  bool error_code_1 = 2;
  bytes payload_2 = 3;
  double user_id_3 = 4;
  uint64 id_4 = 5;
}

message ReportsEventV2 {
  string version_0 = 1;
  fixed64 version_1 = 2;
  bytes user_id_2 = 3;
  uint64 service_id_3 = 4;
  int32 status_4 = 5;
  bytes status_5 = 6;
}

message ReportsRecordV3 {
  int64 timestamp_0 = 1;
  int64 checksum_1 = 2;
  int32 data_2 = 3;
  bytes version_3 = 4;
  int32 batch_id_4 = 5;
  string batch_id_5 = 6;
  fixed64 service_id_6 = 7;
  sint64 status_7 = 8;
}

message ReportsRecordV4 {
  int32 data_0 = 1;
  bytes version_1 = 2;
  int32 nonce_2 = 3;
  bytes signature_3 = 4;
  int64 nonce_4 = 5;
}

message ReportsRecordV5 {
  string id_0 = 1;
  float data_1 = 2;
  fixed64 payload_2 = 3;
  fixed64 timestamp_3 = 4;
  fixed64 timestamp_4 = 5;
  bytes amount_5 = 6;
  sint64 timestamp_6 = 7;
  float batch_id_7 = 8;
}

message ReportsResultV6 {
  bytes payload_0 = 1;
  double error_code_1 = 2;
  uint64 id_2 = 3;
  double signature_3 = 4;
  sint64 status_4 = 5;
}

message ReportsResultV7 {
  uint64 user_id_0 = 1;
  int64 nonce_1 = 2;
  bool timestamp_2 = 3;
  uint64 service_id_3 = 4;
  int64 status_4 = 5;
  bytes retry_count_5 = 6;
  float status_6 = 7;
}

service ReportsService {
  rpc PublishStatement(ReportsEventV4) returns (ReportsResponseV2);
  rpc UpdateStatement(ReportsRequestV3) returns (ReportsResponseV1);
  rpc ReconcileRecord(ReportsEventV0) returns (ReportsResponseV6);
  rpc SubscribeBalance(ReportsEventV5) returns (ReportsResponseV1);
  rpc DeleteLedger(ReportsRequestV6) returns (ReportsResponseV0);
  rpc BatchPayment(ReportsEventV0) returns (ReportsResponseV7);
}
