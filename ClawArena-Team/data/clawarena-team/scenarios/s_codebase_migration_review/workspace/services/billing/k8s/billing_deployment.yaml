# Auto-generated Kubernetes / deployment config for payments-split migration review.
# Service: billing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: payments-split
  labels:
    app: billing
    version: "v2"
    team: platform-migration

spec:
  replicas: 3
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
        version: "v2"
    spec:
      serviceAccountName: billing-sa
      containers:
      - name: billing
        image: gcr.io/payments-split/billing:v2.13.2
        imagePullPolicy: Always
        ports:
        - containerPort: 8333
        env:
        - name: SERVICE_NAME
          value: "billing"
        - name: ENV
          valueFrom:
            secretKeyRef:
              name: billing-secrets
              key: environment
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              name: billing-db-creds
              key: dsn
        resources:
          requests:
            cpu: "169m"
            memory: "512Mi"
          limits:
            cpu: "1392m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8333
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8333
          initialDelaySeconds: 14
          periodSeconds: 5
      - name: billing-sidecar-1
        image: gcr.io/payments-split/billing-sidecar-1:v2.11.95
        imagePullPolicy: Always
        ports:
        - containerPort: 8334
        env:
        - name: SERVICE_NAME
          value: "billing"
        - name: ENV
          valueFrom:
            secretKeyRef:
              name: billing-secrets
              key: environment
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              name: billing-db-creds
              key: dsn
        resources:
          requests:
            cpu: "165m"
            memory: "1024Mi"
          limits:
            cpu: "1744m"
            memory: "2048Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8334
          initialDelaySeconds: 26
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8334
          initialDelaySeconds: 11
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: billing-svc
  namespace: payments-split
spec:
  selector:
    app: billing
  ports:
  - protocol: TCP
    port: 8333
    targetPort: 8333
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: billing-hpa
  namespace: payments-split
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: billing-service
  minReplicas: 3
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: payments-split
data:
  app.yaml: |
    service: billing
    version: v2
    port: 8333
    log_level: info
    timeouts:
      read: 30s
      write: 30s
      idle: 90s
    retry:
      max_attempts: 3
      backoff_ms: 100
    db:
      pool_size: 20
      max_idle: 5
      conn_timeout: 5s
    metrics:
      enabled: true
      path: /metrics
      port: 8334
