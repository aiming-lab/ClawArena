# Auto-generated Kubernetes / deployment config for payments-split migration review.
# Service: ledger
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: payments-split
  labels:
    app: ledger
    version: "v2"
    team: platform-migration

spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
        version: "v2"
    spec:
      serviceAccountName: ledger-sa
      containers:
      - name: ledger
        image: gcr.io/payments-split/ledger:v2.14.32
        imagePullPolicy: Always
        ports:
        - containerPort: 8368
        env:
        - name: SERVICE_NAME
          value: "ledger"
        - name: ENV
          valueFrom:
            secretKeyRef:
              name: ledger-secrets
              key: environment
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              name: ledger-db-creds
              key: dsn
        resources:
          requests:
            cpu: "210m"
            memory: "128Mi"
          limits:
            cpu: "556m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8368
          initialDelaySeconds: 17
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8368
          initialDelaySeconds: 9
          periodSeconds: 5
      - name: ledger-sidecar-1
        image: gcr.io/payments-split/ledger-sidecar-1:v2.15.65
        imagePullPolicy: Always
        ports:
        - containerPort: 8369
        env:
        - name: SERVICE_NAME
          value: "ledger"
        - name: ENV
          valueFrom:
            secretKeyRef:
              name: ledger-secrets
              key: environment
        - name: DB_DSN
          valueFrom:
            secretKeyRef:
              name: ledger-db-creds
              key: dsn
        resources:
          requests:
            cpu: "138m"
            memory: "512Mi"
          limits:
            cpu: "596m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8369
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8369
          initialDelaySeconds: 13
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: ledger-svc
  namespace: payments-split
spec:
  selector:
    app: ledger
  ports:
  - protocol: TCP
    port: 8368
    targetPort: 8368
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-hpa
  namespace: payments-split
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledger-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-config
  namespace: payments-split
data:
  app.yaml: |
    service: ledger
    version: v2
    port: 8368
    log_level: info
    timeouts:
      read: 30s
      write: 30s
      idle: 90s
    retry:
      max_attempts: 3
      backoff_ms: 100
    db:
      pool_size: 12
      max_idle: 3
      conn_timeout: 5s
    metrics:
      enabled: true
      path: /metrics
      port: 8369
