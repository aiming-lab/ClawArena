# Harness experiment config: disable RunSubagent, keep only CreateSubagent / ListSubagents / Workflow.
#
# Purpose: verify the newly added Workflow dynamic-orchestration tool — when the main agent cannot run a
# subagent one-shot via RunSubagent, will it instead route through Workflow's agent() primitive to actually
# execute subagents (CreateSubagent / defineAgent can still create, ListSubagents can still query). The base
# tools (Read/Write/Edit/Bash/Grep/Glob) are kept, otherwise the main agent cannot do work on its own.
#
# Usage:
#   clawarena-team run -d data/clawarena-team/ -o results/wf_exp_wfonly --config configs/exp_wf_only.yaml
#
# The model topology matches configs/local_debug.yaml (the whole gemma-4 family on local vLLM).
# tools.enabled is a list, and --config replaces default.yaml's default 9 tools with the entire list.

tools:
  enabled:
    - Read
    - Write
    - Edit
    - Bash
    - Grep
    - Glob
    - CreateSubagent
    - ListSubagents
    - Workflow

main:
  provider: openai_compat
  model_id: gemma-4-31b-it
  api_base: http://127.0.0.1:8900/v1
  api_key: EMPTY
  api_key_env: null
  modalities: ["text", "image", "video"]

model_pool:
  llm:
    provider: openai_compat
    model_id: gemma-4-31b-it
    api_base: http://127.0.0.1:8900/v1
    api_key: EMPTY
    api_key_env: null
    name: gemma-4-31b-it-text
    modalities: ["text"]
  vlm:
    provider: openai_compat
    model_id: gemma-4-31b-it
    api_base: http://127.0.0.1:8900/v1
    api_key: EMPTY
    api_key_env: null
    name: gemma-4-31b-it-vl
    modalities: ["text", "image", "video"]
  omni:
    provider: openai_compat
    model_id: gemma-4-e4b-it
    api_base: http://127.0.0.1:8902/v1
    api_key: EMPTY
    api_key_env: null
    name: gemma-4-e4b-it
    modalities: ["text", "image", "video", "audio"]

probe:
  enabled: true
  timeout_sec: 30
  max_tokens: 4
